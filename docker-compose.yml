version: '3'

services:
  nakormi:
    build: .
    # Без агента отладки: на сервере, смотрящем в интернет, открытый порт
    # отладчика - это удалённое выполнение кода без пароля.
    command: ["java", "-Dconfig.file=/workspace/application-prod.properties", "-jar", "nakormi.jar"]
    volumes:
      - './src/main/resources/application-prod.properties:/workspace/application-prod.properties'
    restart: always
    container_name: nakormi
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - PG_DATASOURCE_URL=jdbc:postgresql://db:5432/nakormi
      - PG_NAME=pgadmin
      - PG_PASS=pgadmin
      - NAKORMI_BOT_TOKEN
      - YANDEX_TOKEN
    tty: true
    depends_on:
      - db
      - minio

  db:
    image: postgres:latest
    restart: always
    container_name: db
    ports:
      - "25432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    environment:
      - POSTGRES_DB=nakormi
      - POSTGRES_USER=pgadmin
      - POSTGRES_PASSWORD=pgadmin
    command: postgres -c config_file=/etc/postgresql/postgresql.conf

  # Поднимается только по требованию: docker compose --profile tools up -d pgadmin
  pgadmin:
    image: dpage/pgadmin4
    profiles: [tools]
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: "kuramshin.py@yandex.ru"
      PGADMIN_DEFAULT_PASSWORD: "admin"
      PGADMIN_LISTEN_PORT: 80
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - db

  # MinIO Console http://localhost:29001/
  minio:
    # bitnami/minio из публичного каталога Docker Hub убран издателем, поэтому
    # используется его же образ из legacy-каталога: переменные и поведение те же.
    image: bitnamilegacy/minio
    container_name: minio
    ports:
      - "29000:9000"
      - "29001:9001"
    restart: always
    volumes:
      - minio_data_volume:/bitnami/minio/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_REGION_NAME: ru-mos
      MINIO_DEFAULT_BUCKETS: 'files,public:public'

volumes:
  postgres_data:
  pgadmin_data:
    driver: local
  minio_data_volume:
    driver: local