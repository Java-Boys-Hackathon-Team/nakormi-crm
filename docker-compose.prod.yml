name: nakormi

# Продовый запуск на сервере: поднимается только само приложение.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# База и объектное хранилище берутся из common-infra - общих сервисов сервера,
# к которым подключены все проекты. Поэтому docker-compose.yml здесь намеренно
# не подключается: описанные в нём postgres, minio и pgadmin нужны только для
# локальной разработки, где проект должен быть самодостаточным.
#
# Параметры подключения (адреса, имена баз, пароли) лежат в .env.prod рядом с
# этим файлом, права 600, в репозиторий не коммитятся.

services:
  nakormi:
    build: .
    container_name: nakormi
    restart: always
    command: ["java", "-Dspring.config.additional-location=file:/workspace/application-prod.properties", "-jar", "nakormi.jar"]
    volumes:
      # Агент трассировки: один файл на узел вместо копии в каждом образе.
      - /opt/otel:/otel:ro
      - './src/main/resources/application-prod.properties:/workspace/application-prod.properties'
    ports:
      # Порт слушается на хосте: reverse proxy ходит в приложение через него.
      - "8080:8080"
      # Служебный порт с метриками; наружу не проброшен.
      - "9080:9080"
    env_file:
      - .env.prod
    environment:
      # Трассировка запросов. Агент лежит файлом на узле и встраивается в
      # процесс переменной выше - кода приложения это не требует.
      # Метрики уже собираются с actuator, логи - с вывода контейнера,
      # поэтому через агента они не дублируются.
      - OTEL_SERVICE_NAME=nakormi
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://172.17.0.1:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_SAMPLER=parentbased_always_on
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      # Метрики приложения и JVM на служебном порту, отдельном от прикладного.
      - MANAGEMENT_SERVER_PORT=9080
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus,metrics
      - MANAGEMENT_METRICS_TAGS_APPLICATION=nakormi
      - SPRING_PROFILES_ACTIVE=prod
      # За обратным прокси, который терминирует TLS.
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
      # Без этого JVM считает доступной память всего сервера и берёт под кучу
      # четверть от неё, не замечая предела контейнера.
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=55 -javaagent:/otel/opentelemetry-javaagent.jar
    # Сервер делит память между всеми проектами, поэтому у каждого свой потолок.
    # Ориентир - фактический расход приложения плюс запас на пик сборки мусора.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1408M
    networks: [common-infra]

networks:
  common-infra:
    # Сеть поднята проектом common-infra; здесь она только используется.
    external: true
